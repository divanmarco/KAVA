<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié - CAVA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons/bootstrap-icons.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style2.css') }}">
  <style>
    body {
      background-color: #f5f5f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      display: flex;
      max-width: 1900px;
      width: 100%;
      border-radius: 1px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .login-image {
      flex: 1;
      background-image: url("{{ url_for('static', filename='css/Murtazi.jpg') }}");
      background-size: cover;
      background-position: center;
      min-height: 500px;
    }

    .login-form-panel {
      flex: 1;
      background-color: #fff;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="login-image"></div>
    <div class="login-form-panel">
      <h2 class="mb-1 fw-bold">KAVA</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="alert alert-{{ 'danger' if category == 'error' else category }}">{{ message }}</div>
      {% endfor %}
      {% endwith %}

      <h4 class="mt-4">Mot de passe oublié</h4>
      <p class="text-muted">Recevez un lien de réinitialisation par email.</p>

      <form method="POST" action="{{ url_for('forgot_password') }}">
        <div class="mb-3">
          <label class="form-label" for="forgotEmail">Adresse email</label>
          <input type="email" name="email" id="forgotEmail" class="form-control" required>
          <div class="auth-footer">Vous vous souvenez ? <a href="{{ url_for('logout') }}">Retour à la connexion</a>
          </div>
        </div>
        <input type="submit" value="Envoyer le lien">
      </form>
    </div>
  </div>
</body>
</html>
