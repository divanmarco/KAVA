<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('change_password_route') }}" id="changePasswordForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="changePasswordModalLabel">
                        <i class="bi bi-key" aria-hidden="true"></i> Changer le mot de passe
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="cpOld">Mot de passe actuel</label>
                        <div class="input-group">
                            <input type="password" name="old_password" id="cpOld" class="form-control"
                                autocomplete="current-password" required>
                            <button type="button" class="btn btn-outline-secondary toggle-password" data-target="cpOld"
                                aria-label="Afficher ou masquer le mot de passe">
                                <i class="bi bi-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="cpNew">Nouveau mot de passe</label>
                        <div class="input-group">
                            <input type="password" name="new_password" id="cpNew" class="form-control"
                                autocomplete="new-password" required>
                            <button type="button" class="btn btn-outline-secondary toggle-password" data-target="cpNew"
                                aria-label="Afficher ou masquer le mot de passe">
                                <i class="bi bi-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-0">
                        <label class="form-label" for="cpConfirm">Confirmer le nouveau mot de passe</label>
                        <div class="input-group has-validation">
                            <input type="password" name="confirm_password" id="cpConfirm" class="form-control"
                                autocomplete="new-password" required>
                            <button type="button" class="btn btn-outline-secondary toggle-password"
                                data-target="cpConfirm" aria-label="Afficher ou masquer le mot de passe">
                                <i class="bi bi-eye" aria-hidden="true"></i>
                            </button>
                            <div class="invalid-feedback">Les mots de passe ne correspondent pas.</div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary btn-sm"
                        data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-outline-gold btn-sm">
                        <i class="bi bi-check-lg" aria-hidden="true"></i> Modifier
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    (function () {
        var form = document.getElementById('changePasswordForm');
        var pwd = document.getElementById('cpNew');
        var confirmInput = document.getElementById('cpConfirm');
        var modal = document.getElementById('changePasswordModal');

        form.addEventListener('submit', function (e) {
            if (pwd.value !== confirmInput.value) {
                e.preventDefault();
                confirmInput.classList.add('is-invalid');
            }
        });

        confirmInput.addEventListener('input', function () {
            confirmInput.classList.remove('is-invalid');
        });

        modal.addEventListener('hidden.bs.modal', function () {
            form.reset();
            confirmInput.classList.remove('is-invalid');

            modal.querySelectorAll('.toggle-password').forEach(function (btn) {
                document.getElementById(btn.dataset.target).type = 'password';
                var icone = btn.querySelector('i');
                icone.classList.add('bi-eye');
                icone.classList.remove('bi-eye-slash');
            });
        });

        modal.querySelectorAll('.toggle-password').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var input = document.getElementById(btn.dataset.target);
                var icone = btn.querySelector('i');
                var estVisible = input.type === 'text';

                input.type = estVisible ? 'password' : 'text';
                icone.classList.toggle('bi-eye', estVisible);
                icone.classList.toggle('bi-eye-slash', !estVisible);
            });
        });
    })();
</script>
